# =====================================================================
# proxy_rotator 配置文件
# 修改后重启程序生效。所有配置项都在 [proxy] 小节下。
# =====================================================================
[proxy]

# 【必填】获取代理的 API 地址
api_url =

# 接收的协议（上游代理协议）: auto / http / https / socks5
# auto 表示自动匹配；若多个协议都支持，则优先使用 socks5
input_protocol = auto

# 输出的协议（本地 127.0.0.1 监听协议）: same / http / https / socks5
# same 表示与接收的协议相同（本地服务同时兼容 http 与 socks5 连接，自动识别）
output_protocol = same

# 强制更换一个新 IP 的时间（秒），默认 60
force_change_interval = 60

# 若 API 返回 txt，IP 之间的分隔符。留空 = 默认一行一个 IP。
# 自定义分隔符不能为 . 或 :
txt_separator =

# 若 API 返回 json，IP 所在数据路径，支持多个路径用分号隔开，例如：
#   ip
#   proxy.ip
#   proxy[*].ip
#   proxy[*].ip;data[*].ip
# 若未设置，则程序默认只支持 txt；接口返回 json 时程序报错。
json_ip_paths =

# 若 IP 和端口在 json 中分开放置，在此填写端口路径，例如：
#   data[*].port
# 与 json_ip_paths 按顺序一一对应。留空表示端口跟在 IP 后（ip:port）。
json_port_path =

# 用于测试代理 IP 可用性的 URL
# 默认 ip 参数留空，即查询访问者自身的 IP 地理位置
test_url = https://whois.pconline.com.cn/ipJson.jsp?ip=&json=true

# 超时时间（秒），默认 3。超过该时间未成功访问测试 URL 则判定不可用
timeout = 3

# 心跳包测试间隔（秒），默认 10。心跳失败说明 IP 已失效，立即更换
heartbeat_interval = 10

# 多线程测试 IP 可用性: true / false
# false：默认使用第一个可用 IP
# true ：多线程测试每个 IP 访问测试 URL 的速度，使用最快的；
#         最多测试 10 个，超出部分忽略；全部不可用则重新从 API 获取
multithread_test = false

# 是否在输出中显示获取 IP 的地理位置: true / false
# （地理位置数据由太平洋科技 pconline.com.cn 提供支持）
show_location = true

# 程序语言: cn（简体中文）/ en（English）
language = cn

# 输出端口号，默认 1217。其他软件填写 127.0.0.1:1217 即可使用代理
listen_port = 1217

# 最大尝试获取代理次数，默认 10。
# 连续 10 次「请求 API 失败 / 返回内容无法解析 / 所有代理均不可用」则报错退出。
# 重试间隔指数递增（1s, 2s, 4s ...），最大间隔 10 秒。
# 设置为 0 表示无限尝试。
max_retries = 10

# 预备 IP 存货数量，默认 2。
# 后台线程会提前获取并测试好下一个候选代理，存入待用池中。
# 当需要切换时直接使用存货，实现秒级切换，同时后台补货。
# 设置为 0 表示不启用存货功能，每次切换时实时获取。
# 注意：存货 IP 的有效时间从获取时开始计时，与 force_change_interval 一致。
standby_pool_size = 2
